name: Deploy AI Service to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'ai_service/**'
      - '.github/workflows/deploy-ai-service.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-service

jobs:
  build-and-deploy:
    name: Build, Push and Deploy AI Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ai_service
          file: ./ai_service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            LOWER_IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            CONTAINER_NAME="agamotto-ai-service"
            HOST_PORT="8000"
            CONTAINER_PORT="8000"
            ENV_FILE="$HOME/.env.ai-service"
            NETWORK_NAME="agamotto-network"

            echo "==> Authenticating Docker with GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            echo "==> Pulling latest image ($LOWER_IMAGE:latest)..."
            docker pull "$LOWER_IMAGE:latest"

            echo "==> Ensuring shared bridge network exists ($NETWORK_NAME)..."
            docker network create "$NETWORK_NAME" 2>/dev/null || true

            echo "==> Stopping & removing existing container if running..."
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            ENV_PARAM=""
            if [ -f "$ENV_FILE" ]; then
              echo "==> Found environment file at $ENV_FILE"
              ENV_PARAM="--env-file $ENV_FILE"
            else
              echo "==> Notice: No $ENV_FILE found on VM. Starting without env file."
            fi

            echo "==> Starting new container ($CONTAINER_NAME)..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --network "$NETWORK_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              $ENV_PARAM \
              "$LOWER_IMAGE:latest"

            echo "==> Verifying container status..."
            sleep 3
            docker ps --filter "name=$CONTAINER_NAME"

            echo "==> Pruning unused Docker images..."
            docker image prune -f

            echo "==> AI Service deployment completed successfully!"
